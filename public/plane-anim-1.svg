               C 174 61 170 77 173 89 
               C 175 95 179 95 181 89 
               C 183 77 180 61 178 48.5 Z" fill="#e5053a" />
      <!-- Lower Blade White Highlight -->
      <path d="M 175 87 C 176 91 178 91 179 87 C 179 79 178 73 177 73 C 176 73 175 79 175 87 Z" fill="#ffffff" />

